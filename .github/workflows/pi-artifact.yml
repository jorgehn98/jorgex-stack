name: Validate JorgeX Pi artifact

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

concurrency:
  group: pi-artifact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: ${{ (github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft != true) && 'Quality gate' || 'Draft checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record workflow identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          {
            echo "### Workflow identity"
            echo "- Event: ${EVENT_NAME:-n/a}"
            echo "- Action: ${EVENT_ACTION:-n/a}"
            echo "- Tested SHA: $checked_out_sha"
            echo "- Expected checkout SHA: $EXPECTED_SHA"
            echo "- Pull request head SHA: ${PR_HEAD_SHA:-n/a}"
            echo "- Pull request base SHA: ${PR_BASE_SHA:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$checked_out_sha" != "$EXPECTED_SHA" ]]; then
            echo "Checkout SHA mismatch: actual=$checked_out_sha expected=$EXPECTED_SHA" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - name: Download the exact JorgeX Pi artifact
        if: ${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft != true }}
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/jorgex-pi-0.8.4.tgz"
          curl --fail --show-error --silent --retry 3 --retry-max-time 180 --connect-timeout 15 --max-time 120 --max-filesize 89133070 --remove-on-error --output "$tarball" \
            https://registry.npmjs.org/jorgex-pi/-/jorgex-pi-0.8.4.tgz
          actual_bytes="$(wc -c < "$tarball")"
          if [[ "$actual_bytes" -ne 89133070 ]]; then
            echo "JorgeX Pi artifact size mismatch: expected=89133070 received=$actual_bytes" >&2
            rm -f -- "$tarball"
            exit 1
          fi

      - name: Verify the exact JorgeX Pi artifact contract
        if: ${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft != true }}
        env:
          JORGEX_PI_TARBALL: ${{ runner.temp }}/jorgex-pi-0.8.4.tgz
        run: pnpm exec vitest run tests/pi-cross-repo-contract.test.ts

      - run: pnpm test
        if: ${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft != true }}

      - run: pnpm build
        if: ${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft != true }}
