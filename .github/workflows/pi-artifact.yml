name: Validate JorgeX Pi artifact

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download the exact JorgeX Pi artifact
        shell: bash
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/jorgex-pi-0.6.1.tgz"
          curl --fail --show-error --silent --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 300 --output "$tarball" \
            https://registry.npmjs.org/jorgex-pi/-/jorgex-pi-0.6.1.tgz
          test -s "$tarball"

      - run: pnpm typecheck

      - name: Verify the exact JorgeX Pi artifact contract
        env:
          JORGEX_PI_TARBALL: ${{ runner.temp }}/jorgex-pi-0.6.1.tgz
        run: pnpm exec vitest run tests/pi-cross-repo-contract.test.ts

      - run: pnpm test

      - run: pnpm build
