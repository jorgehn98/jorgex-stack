name: Validate JorgeX Pi artifact

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

concurrency:
  group: pi-artifact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: ${{ (github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft != true) && 'Quality gate' || 'Draft checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record workflow identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          {
            echo "### Workflow identity"
            echo "- Event: ${EVENT_NAME:-n/a}"
            echo "- Action: ${EVENT_ACTION:-n/a}"
            echo "- Tested SHA: $checked_out_sha"
            echo "- Expected checkout SHA: $EXPECTED_SHA"
            echo "- Pull request head SHA: ${PR_HEAD_SHA:-n/a}"
            echo "- Pull request base SHA: ${PR_BASE_SHA:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$checked_out_sha" != "$EXPECTED_SHA" ]]; then
            echo "Checkout SHA mismatch: actual=$checked_out_sha expected=$EXPECTED_SHA" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build
        if: ${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft != true }}

      - name: Resolve and verify observed Pi artifact
        if: ${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft != true }}
        env:
          JORGEX_PI_TARBALL: ${{ runner.temp }}/jorgex-pi.tgz
          JORGEX_PI_CANDIDATE: ${{ runner.temp }}/pi-observed.json
        run: node dist/pi-ci-artifact.js "$JORGEX_PI_TARBALL" "$JORGEX_PI_CANDIDATE"

      - name: Verify the observed JorgeX Pi artifact contract
        if: ${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft != true }}
        env:
          JORGEX_PI_TARBALL: ${{ runner.temp }}/jorgex-pi.tgz
          JORGEX_PI_CANDIDATE: ${{ runner.temp }}/pi-observed.json
        run: pnpm exec vitest run tests/pi-cross-repo-contract.test.ts

      - run: pnpm test
        if: ${{ github.event_name != 'pull_request' || github.event.action == 'ready_for_review' || github.event.pull_request.draft != true }}

  browser-windows:
    name: Browser Windows
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/browser-managed-windows.test.ts tests/playwright-windows-execution.test.ts
      - run: pnpm exec vitest run tests/pi-host-version.test.ts
      - run: pnpm exec vitest run tests/browser-provider-resolution.test.ts -t "through the real pnpm stage"

  pi-runtime:
    name: Pi runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PI_TEST_HOST: ${{ github.workspace }}/.validation-artifacts/pi-live-host
      JORGEX_PI_LIVE_ARTIFACT: ${{ github.workspace }}/.validation-artifacts/pi-live.tgz
      PI_TEST_CANDIDATE: ${{ github.workspace }}/.validation-artifacts/pi-live.json
      JORGEX_PI_LIVE_DIAGNOSTICS: ${{ github.workspace }}/.validation-artifacts/pi-live-diagnostics
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Acquire verified Pi artifact and isolated host
        run: |
          node -e "require('fs').mkdirSync(require('path').dirname(process.env.JORGEX_PI_LIVE_ARTIFACT),{recursive:true})"
          node dist/pi-ci-artifact.js "${{ env.JORGEX_PI_LIVE_ARTIFACT }}" "${{ env.PI_TEST_CANDIDATE }}"
          node -e "require('fs').mkdirSync(process.env.PI_TEST_HOST,{recursive:true})"
          pnpm --dir "${{ env.PI_TEST_HOST }}" add --ignore-scripts @earendil-works/pi-coding-agent@latest
      - name: Verify real Pi link layout and failure detection
        run: pnpm exec vitest run tests/pi-linked-smoke-live.test.ts tests/pi-staged-lock.test.ts tests/pi-stage-smoke.test.ts
      - name: Upload Pi live stage diagnostics
        if: ${{ failure() && matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: pi-live-windows-diagnostics
          path: ${{ github.workspace }}/.validation-artifacts/pi-live-diagnostics
          if-no-files-found: ignore
          retention-days: 3
