name: Publish to npm

# Publica en npm en cada push a main, pero SOLO si hay cambios publicables y
# la versión resultante no existe ya en el registry. El build y los tests corren
# en un job sin permisos privilegiados; el bump/push usa solo contents: write;
# el publish usa OIDC sin capacidad de escribir en el repo.

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist
          path: dist
          if-no-files-found: error

  bump:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      publish_sha: ${{ steps.release.outputs.publish_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - id: release
        shell: bash
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const EMPTY_TREE_SHA = '4b825dc642cb6eb9a060e54bf8d69288fbee4904';
          const NPM_NOT_FOUND_PATTERN = /E404|404 Not Found|No match found/i;
          const BRANCH_NAME = (process.env.GITHUB_REF_NAME ?? '').trim();
          const PUBLICABLE_EXACT = new Set([
            'upstreams.json',
            'package.json',
            'pnpm-lock.yaml',
            'tsconfig.json',
            'tsup.config.ts',
            'README.md',
            'PRD.md',
          ]);
          const PUBLICABLE_PREFIXES = ['src/', 'stack/'];
          const WORK_PREFIXES = ['work/', 'worktrees/'];
          const TEST_DIR_PATTERN = /(^|\/)(?:__tests__|tests?|specs?)\//i;
          const TEST_FILE_PATTERN = /(?:^|\/)[^/]+\.(?:test|spec)\.[^/]+$/i;

          const normalize = (input) => input.replace(/\\/g, '/').replace(/^\.\//, '').replace(/^\/+/, '');
          const isWorkPath = (input) => {
            const normalized = normalize(input);
            return WORK_PREFIXES.some((prefix) => normalized.startsWith(prefix));
          };
          const isTestPath = (input) => {
            const normalized = normalize(input);
            return TEST_DIR_PATTERN.test(normalized) || TEST_FILE_PATTERN.test(normalized);
          };
          const isPublicablePath = (input) => {
            const normalized = normalize(input);
            if (WORK_PREFIXES.some((prefix) => normalized.startsWith(prefix))) return false;
            if (PUBLICABLE_EXACT.has(normalized)) return true;
            return PUBLICABLE_PREFIXES.some((prefix) => normalized.startsWith(prefix));
          };
          const bumpPatch = (version) => {
            const match = /^(\d+)\.(\d+)\.(\d+)(?:[-+].*)?$/.exec(version);
            if (!match) throw new Error(`La versión "${version}" no es un semver simple x.y.z.`);
            return `${match[1]}.${match[2]}.${Number(match[3]) + 1}`;
          };
          const npmHasVersion = (packageName, version) => {
            try {
              execFileSync('npm', ['view', `${packageName}@${version}`, 'version'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              return true;
            } catch (error) {
              const message = `${error?.message ?? ''}\n${String(error?.stderr ?? '')}`;
              if (NPM_NOT_FOUND_PATTERN.test(message)) return false;
              throw error;
            }
          };
          const isReleaseBumpCommit = ({ message, actor }) => {
            const trimmedMessage = (message ?? '').trim();
            const trimmedActor = (actor ?? '').trim();
            const lowerMessage = trimmedMessage.toLowerCase();
            if (trimmedMessage === '') return false;
            if (/^chore\(release\):\s+/i.test(trimmedMessage)) return true;
            if (/^release(?:[:\s-]|$)/i.test(trimmedMessage)) return true;
            if (/^v?\d+\.\d+\.\d+(?:[-+][\w.-]+)?$/i.test(trimmedMessage)) return true;
            if (trimmedActor.toLowerCase().includes('bot') && /\b(?:release|publish|bump|version)\b/i.test(lowerMessage)) return true;
            return false;
          };
          const isExpectedNoParentError = (error) => {
            const message = `${error?.message ?? ''}\n${String(error?.stderr ?? '')}`;
            return /unknown revision|ambiguous argument|needed a single revision|does not have any parents/i.test(message);
          };
          const resolveHeadRevision = (input) => {
            const trimmed = input.trim();
            if (trimmed !== '') return trimmed;
            return execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          };
          const assertCurrentReleaseRun = (headSha, originMainSha) => {
            const head = headSha.trim();
            const originMain = originMainSha.trim();

            if (head === '' || originMain === '') {
              throw new Error('No se pudo resolver la SHA de la run o de origin/main.');
            }

            if (head !== originMain) {
              throw new Error('La run está obsoleta: origin/main cambió tras el fetch.');
            }
          };
          const resolveDiffBase = (before, head) => {
            const trimmed = before.trim();
            if (trimmed === '') {
              try {
                return execFileSync('git', ['rev-parse', `${head}^`], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim();
              } catch (error) {
                if (isExpectedNoParentError(error)) return EMPTY_TREE_SHA;
                const message = `${error?.message ?? ''}\n${String(error?.stderr ?? '')}`.trim();
                throw new Error(`No se pudo resolver la base de diff para ${head}: ${message}`);
              }
            }
            return /^0+$/.test(trimmed) ? EMPTY_TREE_SHA : trimmed;
          };
          const resolvePublishDiffBase = (packageVersion, eventBefore, head) => {
            const releaseTag = `v${packageVersion.trim()}`;
            try {
              execFileSync('git', ['rev-parse', '--verify', '--quiet', `${releaseTag}^{commit}`], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              return releaseTag;
            } catch {
              return resolveDiffBase(eventBefore, head);
            }
          };

          if (BRANCH_NAME !== 'main') {
            throw new Error('El bump de release solo puede empujarse a main.');
          }

          const head = resolveHeadRevision(process.env.GITHUB_SHA ?? '');
          execFileSync('git', ['fetch', 'origin', 'main', '--tags'], { stdio: 'inherit' });
          const originMain = execFileSync('git', ['rev-parse', 'origin/main'], { encoding: 'utf8' }).trim();

          try {
            assertCurrentReleaseRun(head, originMain);
          } catch (error) {
            console.log(String(error?.message ?? error));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\nversion=\npublish_sha=\n');
            process.exit(0);
          }

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const before = resolvePublishDiffBase(packageJson.version, process.env.GITHUB_EVENT_BEFORE ?? '', head);
          const changedPaths = execFileSync('git', ['diff', '--name-only', before, head], { encoding: 'utf8' })
            .split('\n')
            .map((line) => normalize(line))
            .filter(Boolean);

          const publicPaths = [];
          const ignoredPaths = [];
          const testPaths = [];
          const workPaths = [];

          for (const rawPath of changedPaths) {
            if (isWorkPath(rawPath)) {
              workPaths.push(rawPath);
              continue;
            }
            if (isTestPath(rawPath)) {
              testPaths.push(rawPath);
              continue;
            }
            if (isPublicablePath(rawPath)) {
              publicPaths.push(rawPath);
              continue;
            }
            ignoredPaths.push(rawPath);
          }

          if (publicPaths.length === 0) {
            console.log('Sin cambios publicables.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=false\nversion=\npublish_sha=${head}\n`);
            process.exit(0);
          }

          console.log(`Cambios publicables en ${publicPaths.join(', ')}`);

          const commitMessage = execFileSync('git', ['log', '-1', '--pretty=%B', head], { encoding: 'utf8' }).trim();
          const releaseBumpCommit = isReleaseBumpCommit({ message: commitMessage, actor: process.env.GITHUB_ACTOR ?? '' });
          const currentVersionExists = npmHasVersion(packageJson.name, packageJson.version);

          let releaseVersion = packageJson.version;
          if (currentVersionExists && !releaseBumpCommit) {
            let nextVersion = bumpPatch(packageJson.version);
            while (npmHasVersion(packageJson.name, nextVersion)) {
              console.log(`${packageJson.name}@${nextVersion} ya existe en npm — se prueba el siguiente patch.`);
              nextVersion = bumpPatch(nextVersion);
            }

            packageJson.version = nextVersion;
            fs.writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);
            execFileSync('git', ['config', 'user.name', 'github-actions[bot]'], { stdio: 'inherit' });
            execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], { stdio: 'inherit' });
            execFileSync('git', ['add', 'package.json'], { stdio: 'inherit' });
            execFileSync('git', ['commit', '-m', `chore(release): bump version to v${nextVersion}`], { stdio: 'inherit' });
            execFileSync('git', ['push', 'origin', `HEAD:${process.env.GITHUB_REF_NAME}`], { stdio: 'inherit' });
            releaseVersion = nextVersion;
          }

          const publishSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const shouldPublish = publicPaths.length > 0 && (!currentVersionExists || !releaseBumpCommit) && !npmHasVersion(packageJson.name, releaseVersion);
          console.log(`${packageJson.name}@${releaseVersion} ${shouldPublish ? 'se publicará.' : 'ya está publicado — no se publica.'}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${shouldPublish ? 'true' : 'false'}\nversion=${releaseVersion}\npublish_sha=${publishSha}\n`);
          NODE

  publish:
    needs: bump
    if: needs.bump.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.bump.outputs.publish_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a1060a0bac45b974a628896c90dbdf5c8093
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: |
          npm pack --dry-run --ignore-scripts
          npm publish --ignore-scripts --provenance

  tag-release:
    needs: [bump, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.bump.outputs.publish_sha }}
          fetch-depth: 0

      - shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.bump.outputs.version }}"
          SHA="${{ needs.bump.outputs.publish_sha }}"
          TAG="v$VERSION"

          if [ -z "$VERSION" ] || [ -z "$SHA" ]; then
            echo "No se pudo resolver la versión o SHA publicada."
            exit 1
          fi

          git fetch origin --tags
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            EXISTING_SHA="$(git rev-list -n 1 "$TAG")"
            if [ "$EXISTING_SHA" != "$SHA" ]; then
              echo "$TAG ya existe pero apunta a $EXISTING_SHA, no a $SHA."
              exit 1
            fi
            echo "$TAG ya existe — no se mueve."
            exit 0
          fi

          git tag "$TAG" "$SHA"
          git push origin "$TAG"
